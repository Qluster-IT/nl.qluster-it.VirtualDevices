<script src='../../../assets/vue.min.js'></script>
<script src='./capabilities.js'></script>
<script>
  Homey.setTitle(__('pair.title.device'));
  new Vue({
    el: '#capab_instructions',
    data: {
      instructions: __('pair.select.capabilities')
    }
  });
  var capabilitiesVue;
  var capabilitiesVueAll;
  var pendingCapabilityUpdates = Promise.resolve(true);
  Homey.emit('getAllCapabilities').then(function(capabilities) {
    capabilitiesVue = new Vue({
      el: '#capabilitiesVue',
      data: {
        capabilities: [],
        capabilityTitles: Object.fromEntries(Object.entries(capabilities).map(([id, value]) => [id, value.title])),
        selectedCapabilities: []
      },
      watch: {
        'selectedCapabilities': function(val){ updateCapabilities( {'capabilities': val.concat(capabilitiesVueAll.selectedCapabilities)} ) }
      }
    });
    capabilitiesVueAll = new Vue({
      el: '#capabilitiesVueAll',
      data: {
        capabilities: capabilities,
        selectedCapabilities: []
      },
      watch: {
        'selectedCapabilities': function(val){ updateCapabilities( {'capabilities':capabilitiesVue.selectedCapabilities.concat(val)} ) }
      }
    });
    
    Homey.emit('getPairingDevice', null, function (err, result) {
      if (err) {
        console.log(err);
        return;
      }
      Homey.emit('log', result, function (err, result2) {});

      Homey.setTitle(__('pair.title.device') + ' ' + result.name);

      var defaults = devices[result.class];
      capabilitiesVue.capabilities = defaults ? defaults.capabilities.filter(key => capabilities[key]) : [];
      if (result.capabilities.length) {
        capabilitiesVue.selectedCapabilities = result.capabilities.filter(key => capabilitiesVue.capabilities.includes(key));
        capabilitiesVueAll.selectedCapabilities = result.capabilities.filter(key => !capabilitiesVue.capabilities.includes(key) && capabilities[key]);
      } else {
        capabilitiesVue.selectedCapabilities = defaults ? defaults.defaultCapabilities.filter(key => capabilities[key]) : [];
        if (!capabilitiesVue.selectedCapabilities.length && capabilitiesVue.capabilities.length) {
          capabilitiesVue.selectedCapabilities = [capabilitiesVue.capabilities[0]];
        }
      }
      for (let i = 0; i < capabilitiesVue.capabilities.length; i++) {
        const element = capabilitiesVue.capabilities[i];
        delete capabilitiesVueAll.capabilities[element];
      }
      var a = capabilitiesVueAll.capabilities;
      capabilitiesVueAll.capabilities = null;
      capabilitiesVueAll.capabilities = a;
      // console.log('result.class', result.class);
      // console.log('devices[result.class].capabilities', devices[result.class].capabilities);
      // console.log('capabilitiesVue.capabilities', capabilitiesVue.capabilities);
      // console.log('capabilitiesVue.selectedCapabilities', capabilitiesVue.selectedCapabilities);
      // console.log('capabilitiesVueAll.selectedCapabilities', capabilitiesVueAll.selectedCapabilities);
      
      //capabilitiesVueAll.selectedCapabilities =  result.capabilities;

      updateCapabilities( {'capabilities': capabilitiesVue.selectedCapabilities.concat(capabilitiesVueAll.selectedCapabilities) } );
    });
  });
  


  function updateCapabilities( capabilities ) {
    pendingCapabilityUpdates = pendingCapabilityUpdates.then(function () {
      return new Promise(function (resolve) {
        Homey.emit('updateCapabilities', capabilities, function (err) {
          if (err) Homey.alert(err.message, 'error');
          resolve(!err);
        });
      });
    }).catch(function (error) {
      Homey.alert(error.message, 'error');
      return false;
    });
  }

  async function navigateCapabilities(next) {
    const buttons = document.querySelectorAll('.vd-actions button');
    buttons.forEach(button => { button.disabled = true; });
    try {
      let current;
      let saved;
      do {
        current = pendingCapabilityUpdates;
        saved = await current;
      } while (current !== pendingCapabilityUpdates);
      if (saved) {
        if (next) Homey.nextView();
        else Homey.showView('class');
      }
    } catch (error) {
      Homey.alert(error.message, 'error');
    } finally {
      buttons.forEach(button => { button.disabled = false; });
    }
  }

</script>

<div class="vd-screen">
<div class="vd-content">
<span id='capab_instructions'>{{instructions}}</span>
<p data-i18n="capability_options.next_view"></p>

<div id="capabilitiesVue">
  <div class="homey-form-group" v-if="capabilities && capabilities.length>0">
    <label class="homey-form-checkbox" v-for="key in capabilities" :key="key">
      <input class="homey-form-checkbox-input" :value="key" type="checkbox" v-model="selectedCapabilities">
      <span class="homey-form-checkbox-checkmark"></span>
      <span class="homey-form-checkbox-text">{{ capabilityTitles[key] || key }}</span>
    </label>
  </div>
</div>

<div id="capabilitiesVueAll">
  <details class="vd-disclosure">
    <summary class="homey-form-label">{{ __('repair.more_capabilities') }}</summary>
    <label class="homey-form-checkbox" v-for="(value, key) in capabilities" :key="key">
      <input class="homey-form-checkbox-input" :value="key" type="checkbox" v-model="selectedCapabilities">
      <span class="homey-form-checkbox-checkmark"></span>
      <span class="homey-form-checkbox-text">{{ value.title }} ({{ key }})</span>
    </label>
  </details>
</div>

</div>
<div class="vd-actions">
  <button class="homey-button-transparent" type="button" onclick="navigateCapabilities(false)" data-i18n="capability_options.previous"></button>
  <button class="homey-button-primary" type="button" onclick="navigateCapabilities(true)" data-i18n="capability_options.next"></button>
</div>
</div>

<link rel="stylesheet" href="./view.css">
