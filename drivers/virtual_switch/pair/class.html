<style>
  .deviceclass {
    position: relative;
    padding: 10px;
    height: 40px;
    margin-bottom: 5px;
    background: #eee;
    border: 1px solid rgba(0,0,0,0.05);
    border-radius: 3px;
    /* line-height: 30px; */
    cursor: pointer;
    word-break: break-word;
  }
</style>

<script src='../../../assets/vue.min.js'></script>
<script src='../../../assets/vue-masonry.min.js'></script>
<script src='./capabilities.js'></script>
<script>
  Vue.use(VueMasonry);
  Homey.setTitle(__('pair.title.device'));
  new Vue({
    el: '#class_instructions',
    data: {
      instructions: __('pair.select.class')
    }
  });
  //var classes = await 
  Homey.emit('getAllClasses').then(function(classes) {
    new Vue({
      el: '#devices-list',
      data: {
        classes: classes
      },
      methods:{
        addClass(deviceClass) {
          Homey.emit('setClass', {'class': deviceClass, 'capabilities': devices[deviceClass] ? devices[deviceClass].defaultCapabilities : []}, function (err, result) {
            if(err){
              Homey.alert(err.message, 'warning');
              console.log(err); 
              return;
            }
            Homey.nextView();
          });
        }
      }
    });

  });
  //var 


  Homey.emit('getPairingDevice', true, function (err, device) {
    if (err) {
      console.log(err);
      return;
    }
    console.log(device);
    Homey.setTitle(__('pair.title.device') + ' ' + device.name);
  })

</script>

<span id='class_instructions'>{{instructions}}</span>
<ul id='devices-list'>
  <masonry
    :cols="3"
    :gutter="10"
    >
    <div v-for='(value, key) in classes'  v-on:click='addClass(key)' class='deviceclass'>
      <span tabindex="-1">{{ value.title }}</span>
    </div>
  </masonry>
</ul>
