<style>
  .vd-icon{
    display: block;
    width: 70%;
    height: 75%;
    -webkit-mask-size: contain;
    -webkit-mask-position: center center;
    -webkit-mask-repeat: no-repeat;
    background: currentColor;
    vertical-align: middle;
    flex: 0 0 auto;
    margin-left: auto;
    margin-right: auto;
  }

  .vd-icon-tile {
    display: flex;
    align-items: center;
    width: 100%;
    height: 72px;
    padding: 5px;
    border: 0;
    background: transparent;
    cursor: pointer;
  }

  #icon_list {
    margin: 0px;
  }
  
  #preview-outerframe {
    display: none;
    width: 100%;
    margin-top: 20px;
    text-align: center;
    margin: 0 auto;
  }
  #preview-innerframe img {
    width: 125px;
    height: 125px;
    padding: 20px;
  }
</style>
<link rel="stylesheet" href="../../virtual_switch/pair/view.css">
<script src='../../../assets/vue.min.js'></script>
<script src='../../../assets/vue-masonry.min.js'></script>
<script>
  Vue.use(VueMasonry);

  var imgBase64 = '';

  Homey.setTitle(__('pair.title.mode'));
 
  Homey.emit('getIcons', null, function (err, icons) {
    if (err) {
      console.log(err);
      return;
    }

    new Vue({
      el: '#icon_list',
      data: {
        icons: icons
      },
      methods:{
        addIcon(icon) {
          Homey.emit('setIcon', {'icon': icon}, function (err, result) {
            if(err){console.log(err); return;}
            Homey.nextView();
          })
        }
      }
    })

  })

  Homey.emit('getPairingDevice', null, function (err, device) {
    if (err) {
      console.log(err);
      return;
    }
    console.log(device);
    Homey.setTitle(__('pair.title.mode') + ' ' + device.name);
  })

  $('#save-icon').click(function() {
    Homey.emit('saveIcon', imgBase64)
      .then(result => {
        Homey.nextView();
      })
      .catch(error => {
        Homey.alert(error.message, 'error');
        Homey.done()
      });
  });

  function loadIcon(event) {
    const img = event.target.files[0];
    const preview = document.getElementById('preview');
    const reader = new FileReader();
    reader.readAsDataURL(img);
    reader.onload = () => {
          imgBase64 = reader.result;
          preview.src = imgBase64;
          if (imgBase64.length > 1048000) return Homey.alert('Image size is too large', 'error');
      $("#preview-outerframe").show();
      $('#save-icon').prop('disabled', false);
          return;
    };
  }
</script>

<div class="vd-screen">
<div class="vd-content">
<div>
  <span data-i18n="pair.select.icon.custom">If you wish to use a custom icon for your device you can upload it here. The icon needs to be in .svg format.</span>
  <div class="homey-form-group">
      <input id="custom-icon" type="file" accept=".svg" name="image" onchange="loadIcon(event)">
  </div>
  <div id="preview-outerframe">
    <div id="preview-innerframe">
      <img id="preview" />
    </div>
  </div>
</div>

<div>
  <span data-i18n="pair.select.icon.standard">Or you can use one of the pre-defined icons.</span>
  <ul id="icon_list">
    <masonry
      :cols="3"
      :gutter="10"
      >
      <button v-for="(item, index) in icons" :key="index" type="button" class="vd-icon-tile"
        :aria-label="item.name" :title="item.name" v-on:click='addIcon(item)'>
        <span class="vd-icon" v-bind:style="{WebkitMaskImage: 'url(/app/com.arjankranenburg.virtual/drivers/mode/assets/' + item.location + ')'}"></span>
      </button>
    </masonry>
  </ul>
</div>
</div>
<div class="vd-actions">
  <button class="homey-button-transparent" type="button" onclick="Homey.showView('name')" data-i18n="capability_options.previous"></button>
  <button id="save-icon" class="homey-button-primary" type="button" data-i18n="pair.button.icon.use" disabled>Save & use</button>
</div>
</div>
